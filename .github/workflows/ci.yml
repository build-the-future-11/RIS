name: Python smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ris-python-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Compile current entry point
        run: python -m py_compile main.py

      - name: Install current runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run numerical regression tests
        run: python -m unittest discover -s tests -v

      - name: Execute current entry point
        shell: bash
        run: |
          set -euo pipefail
          python main.py | tee /tmp/ris-smoke.txt
          test -s /tmp/ris-smoke.txt
